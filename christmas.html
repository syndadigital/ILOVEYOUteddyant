<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Blocky Magic Christmas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Mitr:wght@400;500&display=swap">
<style>
  :root {
    --bg: #070b1a;
    --ink: #f3f1e8;
    --muted: #b9c0cf;
    --green: #1f8a4c;
    --green-deep: #0f4d2a;
    --silver: #d6dae2;
    --gold: #f2c14e;
    --panel: rgba(8, 14, 30, 0.62);
    --line: rgba(214, 218, 226, 0.35);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: "Mitr", system-ui, sans-serif; }
  #stage { position: fixed; inset: 0; }
  canvas { display: block; touch-action: none; }

  .title {
    position: fixed; left: 0; right: 0; top: max(16px, env(safe-area-inset-top));
    text-align: center; pointer-events: none; padding: 0 16px;
    opacity: 0; transform: translateY(-12px); transition: opacity 1.2s ease, transform 1.2s ease;
  }
  .title.show { opacity: 1; transform: none; }
  .title h1 {
    margin: 0; font-family: "Cinzel Decorative", serif; font-weight: 700;
    font-size: clamp(26px, 6vw, 56px); letter-spacing: .04em; line-height: 1.1;
    background: linear-gradient(180deg, #fff6d6, var(--gold) 55%, #b8862a);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 2px 12px rgba(242, 193, 78, .45));
  }
  .title .to { font-family: "Cinzel Decorative", "Mitr", serif; color: var(--gold); font-size: clamp(15px, 4vw, 22px); }
  .title .hny { font-family: "Cinzel Decorative", serif; font-weight: 700; font-size: clamp(15px, 3.6vw, 26px); color: var(--silver); letter-spacing: .04em; margin-top: 2px; text-shadow: 0 2px 10px rgba(0,0,0,.6); }
  .title p { margin: 6px 0 0; color: var(--silver); font-size: clamp(13px, 3.4vw, 17px); text-shadow: 0 1px 8px #000; }

  .hud {
    position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 10px; width: min(420px, calc(100% - 32px));
  }
  .step { font-size: 14px; background: var(--panel); padding: 4px 14px; border-radius: 99px; color: var(--muted); min-height: 1.4em; text-align: center; text-shadow: 0 1px 6px #000; }
  .bar { width: 100%; height: 8px; border-radius: 99px; background: rgba(255,255,255,.12); overflow: hidden; border: 1px solid var(--line); }
  .bar i { display: block; height: 100%; width: 0; background: repeating-linear-gradient(90deg, var(--green) 0 14px, var(--silver) 14px 28px); transition: width .15s linear; }
  .btns { display: flex; gap: 10px; }
  button {
    font: 500 16px "Mitr", system-ui, sans-serif; color: var(--ink); cursor: pointer;
    background: linear-gradient(180deg, var(--green), var(--green-deep));
    border: 2px solid var(--silver); border-radius: 14px; padding: 12px 22px;
    box-shadow: 0 4px 0 #062615, 0 8px 24px rgba(31, 138, 76, .35);
    transition: transform .1s ease, box-shadow .1s ease;
  }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 #062615; }
  button.ghost { background: var(--panel); border-color: var(--line); box-shadow: none; padding: 12px 14px; }
  button[hidden] { display: none; }

  .intro {
    position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none;
  }
  .intro .card {
    pointer-events: auto; text-align: center; padding: 26px 28px; border-radius: 22px;
    background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(6px);
    width: min(360px, calc(100% - 32px)); transition: opacity .5s ease, transform .5s ease;
  }
  .intro.hide .card { opacity: 0; transform: scale(.94); pointer-events: none; }
  .intro h2 { margin: 0 0 6px; font-family: "Cinzel Decorative", serif; color: var(--gold); font-size: 26px; }
  .intro p { margin: 0 0 18px; color: var(--muted); font-size: 14px; line-height: 1.6; }
  .quiz { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; z-index: 5; }
  .quiz[hidden] { display: none; }
  .qcard {
    width: min(420px, 100%); max-height: calc(100% - 24px); overflow-y: auto; text-align: center;
    padding: 24px 22px; border-radius: 24px; background: rgba(8, 14, 30, 0.82);
    border: 1px solid var(--line); backdrop-filter: blur(8px);
    box-shadow: 0 20px 60px rgba(0,0,0,.45); animation: pop .45s cubic-bezier(.2,.9,.3,1.3);
  }
  @keyframes pop { from { opacity: 0; transform: scale(.85) translateY(16px); } to { opacity: 1; transform: none; } }
  .qcard .bear { font-size: 40px; line-height: 1; }
  .qcard .count { font-size: 12px; letter-spacing: .18em; color: var(--muted); text-transform: uppercase; margin: 8px 0 4px; }
  .qcard h3 { margin: 0 0 16px; font-size: 20px; font-weight: 500; line-height: 1.35; text-wrap: balance; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .opts button { padding: 14px 10px; font-size: 15px; border-radius: 16px; box-shadow: 0 3px 0 #062615; background: rgba(31,138,76,.25); border: 1.5px solid var(--line); }
  .opts button:hover, .opts button:focus-visible { background: rgba(31,138,76,.55); border-color: var(--silver); outline: none; }
  .opts button .e { display: block; font-size: 26px; margin-bottom: 4px; }
  .dots { display: flex; justify-content: center; gap: 6px; margin-top: 16px; }
  .dots i { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.2); }
  .dots i.on { background: var(--gold); }
  .wish h2 { margin: 6px 0 2px; font-family: "Cinzel Decorative", serif; font-size: clamp(26px, 7vw, 36px); line-height: 1.1;
    background: linear-gradient(180deg, #fff6d6, var(--gold) 60%, #b8862a); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .wish .yr { font-family: "Cinzel Decorative", serif; font-size: clamp(40px, 12vw, 60px); color: var(--gold); line-height: 1; margin: 2px 0 12px; text-shadow: 0 0 24px rgba(242,193,78,.5); }
  .wish ul { list-style: none; padding: 0; margin: 0 0 14px; display: grid; gap: 8px; text-align: left; }
  .wish li { background: rgba(255,255,255,.06); border-radius: 12px; padding: 10px 12px; font-size: 15px; line-height: 1.45; }
  .wish .sign { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
  .tap { font-size: 14px; padding: 8px 16px; border-radius: 99px; box-shadow: none; background: rgba(242,193,78,.18); border: 1px solid var(--gold); animation: bob 1.6s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-4px); } }
  .joy { position: fixed; left: max(20px, env(safe-area-inset-left)); bottom: calc(env(safe-area-inset-bottom, 0px) + 150px);
    width: 128px; height: 128px; border-radius: 50%; background: rgba(8,14,30,.45); border: 2px solid var(--line);
    touch-action: none; z-index: 4; backdrop-filter: blur(4px); }
  .joy[hidden] { display: none; }
  .joy .knob { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #3fbf73, var(--green-deep)); border: 2px solid var(--silver);
    box-shadow: 0 4px 12px rgba(0,0,0,.5); pointer-events: none; }
  .score { position: fixed; right: max(16px, env(safe-area-inset-right)); top: calc(env(safe-area-inset-top, 0px) + 165px);
    background: var(--panel); border: 1px solid var(--gold); color: var(--gold); border-radius: 99px; padding: 8px 16px;
    font-size: 18px; font-weight: 500; font-variant-numeric: tabular-nums; z-index: 4; }
  .score[hidden] { display: none; }
  .score.bump { animation: bump .35s ease; }
  @keyframes bump { 50% { transform: scale(1.25); } }
  .err { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<div id="stage" aria-label="ฉากต้นคริสต์มาสแบบบล็อก หน้าปราสาทเวทมนตร์ มีน้องหมีสองตัวในชุดพ่อมดสีเขียวเงิน และหิมะตก"></div>

<div class="title" id="title">
  <h1>Merry Christmas</h1>
  <div class="hny">&amp; Happy New Year 2027</div>
  <p class="to" id="to" hidden></p>
  <p id="msg">Wishing you a magical Christmas full of warm hugs &amp; twinkling lights ✨</p>
</div>



<div class="quiz" id="quiz" hidden><div class="qcard" id="qcard"></div></div>

<div class="joy" id="joy" hidden aria-label="จอยสติ๊กบังคับน้องหมี"><div class="knob" id="knob"></div></div>
<div class="score" id="score" hidden>⭐ 0/10</div>

<div class="hud">
  <button class="tap" id="tap" type="button" hidden>🎶 แตะหน้าจอเพื่อเปิดเพลง</button>
  <button class="tap" id="enter" type="button" hidden>✨ เข้าสู่โลกของ TEDDYANT 🎶</button>
  <div class="step" id="step">ลากเพื่อหมุนดูรอบ ๆ ได้</div>
  <div class="bar" aria-hidden="true"><i id="bar"></i></div>
  <div class="btns">
    <button id="fast" class="ghost" type="button" hidden>⏩ เร่ง</button>
    <button id="replay" type="button" hidden>🔁 ต่อใหม่อีกครั้ง</button>
    <button id="sound" class="ghost" type="button" aria-pressed="true">🔊</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(function () {
if (!window.THREE) {
  document.body.insertAdjacentHTML('beforeend', '<div class="err">โหลดฉาก 3D ไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ตแล้วรีเฟรชอีกครั้ง</div>');
  return;
}

/* ---------- palette ---------- */
const C = {
  snow: 0xdfe6f0, snow2: 0xcfd9e8, snow3: 0xc0cde0,
  cobble: 0x7b7f88, cobble2: 0x5f636c,
  rock: 0x4a4e58, rock2: 0x3b3f48,
  stone: 0x8a8f99, stone2: 0x737883, stone3: 0x9da2ab,
  roof: 0x24304d, roof2: 0x1c2640,
  window: 0xffc35c, window2: 0xffdb8a,
  trunk: 0x5b3a1e, trunk2: 0x4a2f17,
  pine: 0x1d6b3a, pine2: 0x175a30, pine3: 0x22803f,
  emerald: 0x14a65a, silver: 0xd9dde3, red: 0xc8102e, gold: 0xf2c14e,
  robe: 0x17171f, robe2: 0x202029,
  sGreen: 0x1a6b3c, sSilver: 0xb9bec7,
  shirt: 0xdfe2e7, fur: 0x8a5a33, fur2: 0xa8723f, muzzle: 0xdcb48e,
  black: 0x111111, blush: 0xe58a8a, wood: 0x3a2412,
  pole: 0x23242a, lamp: 0xffd27a,
};

/* ---------- voxel model ---------- */
const cells = new Map();
const rnd = (() => { let s = 7; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
function put(x, y, z, color, stage, glow = false, size = 1) {
  cells.set(x + ',' + y + ',' + z, { x, y, z, color, stage, glow, size });
}
const pick = arr => arr[Math.floor(rnd() * arr.length)];

const STAGES = [
  { name: 'ปูพื้นหิมะ ❄️', ms: 2600 },
  { name: 'สร้างปราสาทเวทมนตร์ 🏰', ms: 6500 },
  { name: 'ต่อต้นคริสต์มาส 🎄', ms: 5500 },
  { name: 'น้องหมีในชุดพ่อมดเขียว-เงิน 🧸', ms: 5000 },
  { name: 'ของขวัญและไฟประดับ 🎁', ms: 2600 },
  { name: 'ดาวบนยอดต้นไม้ ⭐', ms: 1400 },
];

// 0 — snowy ground + cobble path + castle mound
for (let x = -24; x <= 24; x++) for (let z = -26; z <= 24; z++) {
  const d = Math.hypot(x, z * 0.95);
  if (d > 25) continue;
  let col = pick([C.snow, C.snow, C.snow2, C.snow3]);
  if (Math.abs(x) <= 1 && z >= 8) col = pick([C.cobble, C.cobble2, C.cobble]);
  put(x, 0, z, col, 0);
}
for (let x = -17; x <= 17; x++) for (let z = -26; z <= -11; z++) {
  if (Math.hypot(x, z * 0.95) > 25) continue;
  const edge = Math.min(17 - Math.abs(x), -11 - z);
  const h = Math.min(3, 1 + edge);
  for (let y = 1; y <= h; y++) put(x, y, z, y === h ? pick([C.snow, C.snow2]) : pick([C.rock, C.rock2]), 0);
}

// 1 — castle (sits on mound top, y >= 4)
const B = 4;
function shellBox(x0, x1, y0, y1, z0, z1, stage) {
  for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) for (let z = z0; z <= z1; z++) {
    if (x > x0 && x < x1 && z > z0 && z < z1 && y < y1) continue;
    put(x, y, z, pick([C.stone, C.stone2, C.stone3]), stage);
  }
}
function tower(cx, cz, r, h, stage) {
  for (let y = B; y <= B + h; y++) for (let x = -r - 1; x <= r + 1; x++) for (let z = -r - 1; z <= r + 1; z++) {
    const d = Math.hypot(x, z);
    if (d <= r + 0.3 && (d > r - 1.2 || y === B + h)) put(cx + x, y, cz + z, pick([C.stone, C.stone2, C.stone3]), stage);
  }
  // lit windows on the front side
  for (let y = B + 3; y < B + h - 1; y += 4) {
    put(cx, y, cz + r, C.window, stage, true);
    put(cx, y + 1, cz + r, C.window2, stage, true);
  }
  // cone roof
  let rr = r + 1, y = B + h + 1;
  while (rr >= 0) {
    for (let x = -Math.ceil(rr); x <= Math.ceil(rr); x++) for (let z = -Math.ceil(rr); z <= Math.ceil(rr); z++) {
      const d = Math.hypot(x, z);
      if (d <= rr + 0.3 && d > rr - 1.3) put(cx + x, y, cz + z, rnd() < 0.18 ? C.snow : pick([C.roof, C.roof2]), stage);
    }
    rr -= 0.55; y++;
  }
  put(cx, y, cz, C.snow, stage);
  put(cx, y + 1, cz, C.gold, stage, true);
}
shellBox(-9, 9, B, B + 7, -19, -14, 1);
for (let x = -9; x <= 9; x += 2) { put(x, B + 8, -14, rnd() < .5 ? C.snow : C.stone, 1); put(x, B + 8, -19, C.stone, 1); }
for (let x = -7; x <= 7; x += 3) for (const y of [B + 2, B + 5]) {
  put(x, y, -14, C.window, 1, true); put(x, y + 1, -14, C.window2, 1, true);
}
put(-1, B, -14, C.wood, 1); put(0, B, -14, C.wood, 1); put(1, B, -14, C.wood, 1);
put(-1, B + 1, -14, C.wood, 1); put(0, B + 1, -14, C.wood, 1); put(1, B + 1, -14, C.wood, 1); put(0, B + 2, -14, C.wood, 1);
tower(-12, -16, 2.6, 14, 1);
tower(12, -16, 2.6, 12, 1);
tower(0, -21, 3.2, 20, 1);
tower(-6, -22, 2, 16, 1);
tower(7, -22, 2.2, 17, 1);

// 2 — christmas tree
for (let x = -1; x <= 1; x++) for (let z = -1; z <= 1; z++) for (let y = 1; y <= 3; y++) put(x, y, z, pick([C.trunk, C.trunk2]), 2);
const tiers = [[3, 6, 7.2, 3.2], [8, 6, 5.8, 2.2], [13, 5, 4.4, 1.2], [17, 5, 3, 0.2]];
const shellCells = [];
for (const [y0, hgt, rb, rt] of tiers) {
  for (let i = 0; i < hgt; i++) {
    const y = y0 + i, r = rb + (rt - rb) * (i / (hgt - 1));
    const R = Math.ceil(r);
    for (let x = -R; x <= R; x++) for (let z = -R; z <= R; z++) {
      const d = Math.hypot(x, z);
      if (d > r + 0.35) continue;
      if (i > 0 && d < r - 1.6) continue;
      const outer = d > r - 0.9;
      put(x, y, z, pick([C.pine, C.pine2, C.pine3]), 2);
      if (outer) shellCells.push({ x, y, z, i, hgt, a: Math.atan2(z, x) });
    }
  }
}
put(0, 22, 0, C.pine, 2); put(0, 23, 0, C.pine2, 2);
// silver tinsel spiral, snow on tier rims, ornaments and fairy lights
for (const c of shellCells) {
  const spiral = ((c.a / (Math.PI * 2) + c.y * 0.09) % 1 + 1) % 1;
  if (spiral < 0.06) { put(c.x, c.y, c.z, C.silver, 2); continue; }
  if (c.i === 0 && rnd() < 0.45) { put(c.x, c.y, c.z, C.snow, 2); continue; }
  const r = rnd();
  if (r < 0.10) put(c.x, c.y, c.z, pick([C.emerald, C.silver, C.red, C.gold]), 2);
  else if (r < 0.17) put(c.x, c.y, c.z, pick([0xfff1c2, 0x8dffb7, 0xffd166]), 2, true);
}

// 3 — teddy bears in green & silver wizard robes
// small chibi teddy, built from mini blocks (size Q) for a rounder, cuter look
function bear(ox, oz, fur, wandSide, sink, Q = 0.36) {
  const S = 3;
  const P = sink
    ? (x, y, z, col, glow) => sink.set(x + ',' + y + ',' + z, { x: x * Q, y: 0.5 + Q / 2 + (y - 1) * Q, z: z * Q, col, glow })
    : (x, y, z, col, glow) => put(+(ox + x * Q).toFixed(3), +(0.5 + Q / 2 + (y - 1) * Q).toFixed(3), +(oz + z * Q).toFixed(3), col, S, glow, Q);
  const inE = (x, y, z, cx, cy, cz, rx, ry, rz) => ((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2 + ((z - cz) / rz) ** 2 <= 1;
  // feet with tan pads
  for (const sx of [-1, 1]) for (let x = 1; x <= 3; x++) for (let y = 1; y <= 2; y++) for (let z = -1; z <= 2; z++) {
    if ((x === 1 || x === 3) && (z === -1 || z === 2) && y === 2) continue;
    P(sx * x, y, z, z === 2 && y === 1 ? C.muzzle : fur);
  }
  // robe: round body with flared hem
  for (let y = 2; y <= 8; y++) for (let x = -5; x <= 5; x++) for (let z = -4; z <= 4; z++) {
    const r = y <= 3 ? 4.6 : 3.7;
    if (!inE(x, 0, z, 0, 0, 0, r, 1, r * 0.82)) continue;
    P(x, y, z, pick([C.robe, C.robe2]));
  }
  for (let y = 4; y <= 8; y++) P(0, y, 3, C.shirt);
  for (let y = 4; y <= 8; y++) P(0, y, 4, y % 2 ? C.sGreen : C.sSilver); // striped tie
  for (let y = 5; y <= 8; y++) { P(-1, y, 3, C.sGreen); P(1, y, 3, C.sGreen); } // green lining
  P(-2, 6, 3, C.sSilver); P(-2, 5, 3, C.sGreen); // house badge
  for (let x = -4; x <= 4; x++) P(x, 2, 3, x % 2 ? C.sGreen : C.robe); // hem trim
  // stubby arms + paws
  for (const sx of [-1, 1]) {
    for (let y = 5; y <= 7; y++) for (let z = -1; z <= 1; z++) P(sx * 4, y, z, C.robe);
    P(sx * 5, 5, 0, C.robe); P(sx * 5, 4, 1, C.sGreen);
    P(sx * 5, 3, 1, fur); P(sx * 5, 3, 2, fur); P(sx * 4, 4, 1, fur);
  }
  // wand
  const wx = wandSide * 5;
  P(wx, 4, 3, C.wood); P(wx, 5, 4, C.wood); P(wx, 6, 5, C.wood);
  P(wx, 7, 6, 0x9dffc8, true);
  // striped scarf + tail
  for (let x = -4; x <= 4; x++) for (let z = -4; z <= 4; z++) {
    if (!inE(x, 0, z, 0, 0, 0, 4.4, 1, 3.8) || inE(x, 0, z, 0, 0, 0, 3.2, 1, 2.6)) continue;
    P(x, 9, z, (x + z + 40) % 2 ? C.sGreen : C.sSilver);
  }
  for (let y = 5; y <= 8; y++) P(-wandSide * 2, y, 4, y % 2 ? C.sSilver : C.sGreen);
  // big round head
  const front = {};
  for (let y = 10; y <= 18; y++) for (let x = -6; x <= 6; x++) for (let z = -5; z <= 5; z++) {
    if (!inE(x, y, z, 0, 14, 0, 6.2, 4.6, 4.8)) continue;
    P(x, y, z, fur);
    const k = x + ',' + y; front[k] = Math.max(front[k] ?? -99, z);
  }

const LOOP_BEATS = CH.length * 3;

function scheduleMusic() {
  if (!musicOn || !ac) return;
  const ahead = ac.currentTime + 0.25;
  while (true) {
    const melT = mi < SONG.length ? loopStart + SONG[mi].t * BEAT : Infinity;
    const barT = bar < CH.length ? loopStart + bar * 3 * BEAT : Infinity;
    if (melT === Infinity && barT === Infinity) { loopStart += LOOP_BEATS * BEAT; mi = 0; bar = 0; continue; }
    const t = Math.min(melT, barT);

    if (melT <= barT) { const n = SONG[mi++]; bell(n.m + 12, melT, 0.16, Math.max(1.2, n.d * BEAT * 3)); }
    else {
      const c = CH[bar++];
      bell(c[0] + 12, barT, 0.09, 1.4);
      bell(c[1] + 12, barT + BEAT, 0.05, 0.9); bell(c[2] + 12, barT + BEAT, 0.045, 0.9);
      bell(c[2] + 12, barT + 2 * BEAT, 0.05, 0.9); bell(c[3] + 12, barT + 2 * BEAT, 0.045, 0.9);

{

const camFwd = new THREE.Vector3(), camRight = new THREE.Vector3(), mv = new THREE.Vector3();
function updateGame(dt) {

  player.scale.setScalar(Math.min(1, g.t / 400) || 0.001);

  let ix = joyV.x, iy = joyV.y;

  if (keys['keys'] || keys['arrowdown']) iy += 1;

  camRight.crossVectors(camFwd, new THREE.Vector3(0, 1, 0));
  mv.set(0, 0, 0).addScaledVector(camFwd, -iy).addScaledVector(camRight, ix);
  const moving = !g.done && mv.lengthSq() > 0.01;

    body.rotation.z = Math.sin(g.walk) * 0.12;
    if (Math.sin(g.walk) * Math.sin(g.walk - s * 14) < 0) click(380);
  } else {
    body.position.y *= 0.8; body.rotation.z *= 0.8;
  }
  // camera follows little Teddy
  const tgt = player.position.clone().add(new THREE.Vector3(0, 3, 0));
  const delta = tgt.clone().sub(controls.target).multiplyScalar(Math.min(1, s * 4));
  controls.target.add(delta); camera.position.add(delta);

    it.mesh.rotation.y += s * 1.8;

/* ---------- loop ---------- */
let last = performance.now(), finishT = 0, twinkleAcc = 0;
function loop(now) {
  const dt = Math.max(0, Math.min(50, now - last)); last = now;
  if (qrT >= 0) updateQR(dt);
  if (building) updateBuild(dt);
  if (bursts.length) updateBursts(dt);
  if (finished) {
    finishT += dt;
    candles.children.forEach((c, i) => {
      const s = Math.min(1, Math.max(0, (finishT - i * 90) / 600));
      c.scale.setScalar(Math.max(0.001, s));
      c.position.y = c.userData.base + Math.sin(now / 900 + c.userData.ph) * 0.6;
    });
  }
  // twinkle tree lights
  twinkleAcc += dt;
  if (twinkleAcc > 140 && twinkles.length) {
    twinkleAcc = 0;
    for (let k = 0; k < 6; k++) {
      const b = twinkles[Math.floor(Math.random() * twinkles.length)];
      tmpC.setHex(b.color).multiplyScalar(0.35 + Math.random() * 1.2);
      glowMesh.setColorAt(b.idx, tmpC);
    }
    glowMesh.instanceColor.needsUpdate = true;
  }
  // snow
  const p = snowGeo.attributes.position.array, t = now / 1000;
  for (let i = 0; i < SNOW; i++) {
    p[i * 3 + 1] -= sv[i] * dt / 1000;
    p[i * 3] += Math.sin(t + i) * 0.006;
    if (p[i * 3 + 1] < 0) p[i * 3 + 1] = 60;
  }
  snowGeo.attributes.position.needsUpdate = true;
  treeGlow.intensity = 0.85 + Math.sin(now / 400) * 0.1;
  if (game) updateGame(dt);
  controls.update();
  composer.render();
  requestAnimationFrame(loop);
}
